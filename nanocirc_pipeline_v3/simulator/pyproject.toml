[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocirc-sim"
version = "0.1.0"
description = "Fast, reproducible, database-fittable circRNA simulator with correct BED12 ground truth and mandatory BSJ-in-read verification"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "pysam>=0.21",
    "tqdm>=4.60",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
nanocirc-sim = "nanocirc_sim.cli:main"

[tool.setuptools.packages.find]
include = ["nanocirc_sim*"]
