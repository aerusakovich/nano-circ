[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocirc-benchmark"
version = "0.1.0"
description = "Self-contained circRNA quantifier/caller benchmark suite: structural precision/recall, expression correlation, and GT-expression-tertile discovery sensitivity"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
    "pysam>=0.21",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
nanocirc-benchmark = "nanocirc_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["nanocirc_benchmark*"]
